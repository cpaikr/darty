name: AXI Upstream Watch

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Check AXI upstream baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run scripts/check-axi-upstream.ts --report axi-upstream-report.md

      - name: Upload AXI upstream report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: axi-upstream-report
          path: axi-upstream-report.md
          if-no-files-found: ignore
