name: AXI Upstream Watch

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Check AXI upstream baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run scripts/check-axi-upstream.ts --report axi-upstream-report.md

      - name: Upload AXI upstream report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axi-upstream-report
          path: axi-upstream-report.md
          if-no-files-found: ignore
