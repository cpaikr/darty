name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node for npm publishing
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read package metadata
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$PACKAGE_VERSION." >&2
            exit 1
          fi

          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "PUBLIC_RELEASE_TAG=darty-v$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build npm CLI bundle
        run: bun run build

      - name: Build standalone binary release assets
        run: bun run build:binaries

      - name: Publish npm package
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published; skipping npm publish."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload assets to public GitHub Release
        run: |
          if gh release view "$PUBLIC_RELEASE_TAG" --repo open-creo/open-creo >/dev/null 2>&1; then
            gh release upload "$PUBLIC_RELEASE_TAG" dist-bin/release/* \
              --repo open-creo/open-creo \
              --clobber
          else
            gh release create "$PUBLIC_RELEASE_TAG" dist-bin/release/* \
              --repo open-creo/open-creo \
              --title "darty v$PACKAGE_VERSION" \
              --notes "Standalone darty binaries for $PACKAGE_NAME@$PACKAGE_VERSION. The npm package is published separately."
          fi
        env:
          GH_TOKEN: ${{ secrets.OPEN_CREO_RELEASE_TOKEN }}
