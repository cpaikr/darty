name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing source tag to publish; leave empty for a build-only candidate run"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  metadata:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'sjunepark' && github.triggering_actor == 'sjunepark'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      source_tag: ${{ steps.source.outputs.source_tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}

    steps:
      - name: Check out repository for tag verification
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve and verify source tag
        id: source
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "$DISPATCH_TAG" ]; then
            echo "source_tag=" >> "$GITHUB_OUTPUT"
            echo "source_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SOURCE_TAG="$DISPATCH_TAG"

          if [[ ! "$SOURCE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Source tag $SOURCE_TAG is not a stable vx.y.z tag." >&2
            exit 1
          fi

          TAG_REF="refs/tags/$SOURCE_TAG"
          if ! git check-ref-format "$TAG_REF"; then
            echo "Invalid source tag ref $TAG_REF." >&2
            exit 1
          fi
          if ! TAG_OBJECT_SHA="$(git ls-remote --exit-code --refs origin "$TAG_REF" | awk -v tag_ref="$TAG_REF" '$2 == tag_ref { print $1; exit }')"; then
            echo "No real source tag exists at $TAG_REF." >&2
            exit 1
          fi
          if [ -z "$TAG_OBJECT_SHA" ]; then
            echo "Remote did not return the expected ref $TAG_REF." >&2
            exit 1
          fi

          PEELED_SHA="$(git ls-remote origin "${TAG_REF}^{}" | awk -v peeled_ref="${TAG_REF}^{}" '$2 == peeled_ref { print $1; exit }')"
          SOURCE_SHA="${PEELED_SHA:-$TAG_OBJECT_SHA}"
          git fetch --force --no-tags origin "$TAG_REF:$TAG_REF"
          RESOLVED_SHA="$(git rev-parse --verify "${TAG_REF}^{commit}")"
          if [ "$RESOLVED_SHA" != "$SOURCE_SHA" ]; then
            echo "Tag $TAG_REF resolved to $RESOLVED_SHA, expected $SOURCE_SHA." >&2
            exit 1
          fi

          echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out immutable source
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: git checkout --detach "$SOURCE_SHA"

      - name: Require successful CI for exact source commit
        if: steps.source.outputs.source_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          CI_RUN_ID="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SOURCE_SHA}&event=workflow_dispatch&per_page=100" \
              --jq ".workflow_runs[] | select(.head_sha == \"${SOURCE_SHA}\" and .head_branch == \"main\" and .actor.login == \"sjunepark\" and .triggering_actor.login == \"sjunepark\" and .conclusion == \"success\") | .id" |
              head -n 1
          )"

          if [ -z "$CI_RUN_ID" ]; then
            echo "No successful CI workflow run validates source commit $SOURCE_SHA." >&2
            exit 1
          fi

          echo "CI workflow run $CI_RUN_ID validates source commit $SOURCE_SHA."

      - name: Read package metadata
        id: package
        shell: bash
        env:
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ -n "$SOURCE_TAG" ] && [ "$SOURCE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Tag $SOURCE_TAG does not match package version v$PACKAGE_VERSION." >&2
            exit 1
          fi

          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

  validation:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'sjunepark' && github.triggering_actor == 'sjunepark'
    needs: metadata
    uses: ./.github/workflows/validate.yml
    with:
      source_sha: ${{ needs.metadata.outputs.source_sha }}

  standalone:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'sjunepark' && github.triggering_actor == 'sjunepark'
    needs: [metadata, validation]
    uses: ./.github/workflows/standalone.yml
    with:
      source_sha: ${{ needs.metadata.outputs.source_sha }}
      all_targets: true

  github_release:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'sjunepark' && github.triggering_actor == 'sjunepark' && needs.metadata.outputs.source_tag != ''
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs:
      - metadata
      - standalone
    permissions:
      contents: write
    env:
      SOURCE_TAG: ${{ needs.metadata.outputs.source_tag }}
      SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}

    steps:
      - name: Check out validated source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: darty-release
          path: release-artifact/bundle

      - name: Recheck source tag immediately before release completion
        shell: bash
        run: |
          set -euo pipefail
          TAG_REF="refs/tags/$SOURCE_TAG"
          if ! git ls-remote --exit-code --refs origin "$TAG_REF" >/dev/null; then
            echo "Source tag $TAG_REF no longer exists." >&2
            exit 1
          fi
          git fetch --force --no-tags origin "$TAG_REF:$TAG_REF"
          RESOLVED_SHA="$(git rev-parse --verify "${TAG_REF}^{commit}")"
          if [ "$RESOLVED_SHA" != "$SOURCE_SHA" ]; then
            echo "Tag $TAG_REF resolved to $RESOLVED_SHA, expected $SOURCE_SHA." >&2
            exit 1
          fi

      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/complete-github-release.mjs
          --repository "$GITHUB_REPOSITORY"
          --tag "$SOURCE_TAG"
          --sha "$SOURCE_SHA"
          --directory release-artifact/bundle
