name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      source_sha: ${{ github.sha }}

  standalone:
    needs: validate
    uses: ./.github/workflows/standalone.yml
    with:
      source_sha: ${{ github.sha }}
      all_targets: ${{ github.event_name == 'pull_request' }}
