name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit high-severity npm dependencies
        run: bun audit --audit-level=high

      - name: Check DART wire authority
        run: bun run check:dart-wire

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build npm CLI bundle
        run: bun run build

      - name: Check CLI v1 compatibility baseline
        run: node scripts/judge-cli-v1.mjs --profile full -- node dist/cli.js

      - name: Prove CLI parity mutation sensitivity
        run: node scripts/prove-cli-v1-mutation.mjs

      - name: Pin the archive producer
        run: npm install --global npm@11.6.2

      - name: Pack the release artifact once
        run: node scripts/release-artifact.mjs pack release-artifact

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: darty-package
          path: release-artifact/*
          if-no-files-found: error
          retention-days: 14

  consume:
    needs: validate
    uses: ./.github/workflows/package-consumer.yml
    with:
      source_sha: ${{ github.sha }}
      linux_arm64: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}

  rust_candidate:
    name: Rust candidate (1.88)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt

      - name: Verify toolchain
        run: |
          rustc +1.88.0 --version
          cargo +1.88.0 --version

      - name: Check formatting
        run: cargo +1.88.0 fmt --all -- --check

      - name: Test workspace
        run: cargo +1.88.0 test --workspace --all-features --locked

      - name: Lint workspace
        run: cargo +1.88.0 clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.88.0 doc --workspace --all-features --no-deps --locked

      - name: Audit dependencies
        run: |
          cargo +1.88.0 install cargo-audit --version 0.22.2 --locked
          cargo +1.88.0 install cargo-deny --version 0.19.0 --locked
          cargo +1.88.0 audit
          cargo +1.88.0 deny --locked --all-features check
