name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.18.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check DART wire authority
        run: bun run check:dart-wire

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build npm CLI bundle
        run: bun run build

      - name: Check CLI v1 compatibility baseline
        run: node scripts/judge-cli-v1.mjs --profile full -- node dist/cli.js

      - name: Prove CLI parity mutation sensitivity
        run: node scripts/prove-cli-v1-mutation.mjs

  rust_candidate:
    name: Rust candidate (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt

      - name: Verify toolchain
        run: |
          rustc +1.88.0 --version
          cargo +1.88.0 --version

      - name: Check formatting
        run: cargo +1.88.0 fmt --all -- --check

      - name: Test workspace
        run: cargo +1.88.0 test --workspace --all-features --locked

      - name: Lint workspace
        run: cargo +1.88.0 clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.88.0 doc --workspace --all-features --no-deps --locked

      - name: Audit dependencies
        run: |
          cargo +1.88.0 install cargo-audit --version 0.22.2 --locked
          cargo +1.88.0 install cargo-deny --version 0.19.0 --locked
          cargo +1.88.0 audit
          cargo +1.88.0 deny --locked --all-features check

  candidate_darwin_arm64:
    name: Candidate package (darwin-arm64, unpublished)
    needs:
      - validate
      - rust_candidate
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.18.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify current host
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64

      - name: Set up Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Build unpublished candidate
        run: |
          cargo +1.88.0 build --release --locked -p darty-cli --features fixture-origin
          cargo +1.88.0 build --release --locked -p darty-node

      - name: Test packaged candidate
        run: node scripts/test-rust-candidate.mjs

      - name: Test candidate compatibility
        run: node scripts/judge-cli-v1.mjs --profile candidate -- target/release/darty
