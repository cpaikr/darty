name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.18.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build npm CLI bundle
        run: bun run build

      - name: Check CLI v1 compatibility baseline
        run: node scripts/judge-cli-v1.mjs --profile full -- node dist/cli.js

      - name: Prove CLI parity mutation sensitivity
        run: node scripts/prove-cli-v1-mutation.mjs
