name: Standalone archives

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      all_targets:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  targets:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'sjunepark' && github.triggering_actor == 'sjunepark'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      build: ${{ steps.matrix.outputs.build }}
      consume: ${{ steps.matrix.outputs.consume }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Read tool-owned target matrix
        id: matrix
        env:
          TARGET_SCOPE: ${{ inputs.all_targets && 'all' || 'linux-x64' }}
        run: |
          node scripts/standalone.mjs matrix "$TARGET_SCOPE" > "$RUNNER_TEMP/matrix.json"
          node -e 'const fs = require("fs"); const matrix = JSON.parse(fs.readFileSync(process.argv[1])); for (const [key, value] of Object.entries(matrix)) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${JSON.stringify(value)}\n`);' "$RUNNER_TEMP/matrix.json"

  build:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'sjunepark' && github.triggering_actor == 'sjunepark'
    name: Cross-build / ${{ matrix.id }}
    needs: targets
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.build) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0
      - run: rustup toolchain install 1.88.0 --profile minimal
      - name: Cross-build Rust CLI and applicable Node addon
        env:
          TARGET_ID: ${{ matrix.id }}
        run: |
          RUST_TARGET=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("scripts/release-targets.json")).find(t => t.id === process.env.TARGET_ID).rustTarget)')
          bash scripts/cross-build.sh "$TARGET_ID" "$RUST_TARGET"
          EXECUTABLE=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("scripts/release-targets.json")).find(t => t.id === process.env.TARGET_ID).executable)')
          node scripts/standalone.mjs build "$TARGET_ID" release-artifact/archive "target/$RUST_TARGET/release/$EXECUTABLE"
          case "$TARGET_ID" in
            linux-x64-gnu) node scripts/sdk-artifacts.mjs node "$TARGET_ID" "target/$RUST_TARGET/release/libdarty_node.so" release-artifact/sdk ;;
            darwin-arm64) node scripts/sdk-artifacts.mjs node "$TARGET_ID" "target/$RUST_TARGET/release/libdarty_node.dylib" release-artifact/sdk ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: darty-archive-${{ matrix.id }}
          path: release-artifact/archive/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.id == 'linux-x64-gnu' || matrix.id == 'darwin-arm64'
        with:
          name: darty-sdk-${{ matrix.id }}
          path: release-artifact/sdk/*
          if-no-files-found: error
          retention-days: 14

  consume:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'sjunepark' && github.triggering_actor == 'sjunepark'
    name: Certify / ${{ matrix.id }}
    needs: [targets, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.consume) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: darty-archive-${{ matrix.id }}
          path: release-artifact/archive
      - name: Install and certify exact archive without a runtime on PATH
        run: node scripts/standalone.mjs certify ${{ matrix.id }} release-artifact/archive release-artifact/report/${{ matrix.id }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: darty-certification-${{ matrix.id }}
          path: release-artifact/report/*
          if-no-files-found: error
          retention-days: 14

  sdk:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'sjunepark' && github.triggering_actor == 'sjunepark'
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0
      - run: rustup toolchain install 1.88.0 --profile minimal
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: darty-sdk-linux-x64-gnu
          path: release-artifact/sdk
      - name: Certify exact native tarball in a clean Node consumer
        run: node scripts/sdk-artifacts.mjs certify-node release-artifact/sdk linux-x64-gnu
      - name: Package and certify Rust SDK in a clean external consumer
        run: node scripts/sdk-artifacts.mjs rust release-artifact/sdk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: darty-sdk-certified
          path: release-artifact/sdk/*
          if-no-files-found: error
          retention-days: 14

  bundle:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'sjunepark' && github.triggering_actor == 'sjunepark' && inputs.all_targets
    needs: [build, consume, sdk]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: darty-archive-*
          path: release-artifact/archives
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: darty-certification-*
          path: release-artifact/reports
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: darty-sdk-certified
          path: release-artifact/sdks
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: darty-sdk-darwin-arm64
          path: release-artifact/sdks
      - name: Require complete target inventory and Linux certification
        run: node scripts/standalone.mjs assemble release-artifact/archives release-artifact/reports release-artifact/sdks release-artifact/bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: darty-release
          path: release-artifact/bundle/*
          if-no-files-found: error
          retention-days: 14
