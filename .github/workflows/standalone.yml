name: Standalone archives

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      all_targets:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  targets:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      build: ${{ steps.matrix.outputs.build }}
      consume: ${{ steps.matrix.outputs.consume }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Read tool-owned target matrix
        id: matrix
        env:
          TARGET_SCOPE: ${{ inputs.all_targets && 'all' || 'linux-x64' }}
        run: |
          node scripts/standalone.mjs matrix "$TARGET_SCOPE" > "$RUNNER_TEMP/matrix.json"
          node -e 'const fs = require("fs"); const matrix = JSON.parse(fs.readFileSync(process.argv[1])); for (const [key, value] of Object.entries(matrix)) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${JSON.stringify(value)}\n`);' "$RUNNER_TEMP/matrix.json"

  build:
    name: Cross-build / ${{ matrix.id }}
    needs: targets
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.build) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Compile and archive standalone CLI
        run: node scripts/standalone.mjs build ${{ matrix.id }} release-artifact/archive
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: darty-archive-${{ matrix.id }}
          path: release-artifact/archive/*
          if-no-files-found: error
          retention-days: 14

  consume:
    name: Certify / ${{ matrix.id }}
    needs: [targets, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.consume) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: darty-archive-${{ matrix.id }}
          path: release-artifact/archive
      - name: Install and certify exact archive without a runtime on PATH
        run: node scripts/standalone.mjs certify ${{ matrix.id }} release-artifact/archive release-artifact/report/${{ matrix.id }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: darty-certification-${{ matrix.id }}
          path: release-artifact/report/*
          if-no-files-found: error
          retention-days: 14

  bundle:
    if: inputs.all_targets
    needs: [build, consume]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: darty-archive-*
          path: release-artifact/archives
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: darty-certification-*
          path: release-artifact/reports
          merge-multiple: true
      - name: Require complete target inventory and Linux certification
        run: node scripts/standalone.mjs assemble release-artifact/archives release-artifact/reports release-artifact/bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: darty-release
          path: release-artifact/bundle/*
          if-no-files-found: error
          retention-days: 14
