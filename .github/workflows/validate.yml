name: Validate Rust repository

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'sjunepark' && github.triggering_actor == 'sjunepark'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Set up Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - run: node scripts/sdk-artifacts.mjs versions
      - run: cargo +1.88.0 fmt --all -- --check
      - run: cargo +1.88.0 test --workspace --all-features --locked
      - run: cargo +1.88.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.88.0 doc --workspace --all-features --no-deps --locked
      - name: Audit Rust dependencies
        run: |
          cargo +1.88.0 install cargo-audit --version 0.22.2 --locked
          cargo +1.88.0 install cargo-deny --version 0.19.0 --locked
          cargo +1.88.0 audit
          cargo +1.88.0 deny --locked --all-features check
      - name: Build production CLI and Node addon
        run: cargo +1.88.0 build --release --locked -p darty-cli -p darty-node
      - run: bun run check:dart-wire
      - run: bun run typecheck
      - run: bun test
      - name: Build isolated fixture artifacts
        run: cargo +1.88.0 build --release --locked -p darty-cli -p darty-node --features darty-cli/fixture-origin,darty-node/test-fixture --target-dir target/fixture
      - name: Full CLI contract and fault judge
        run: node scripts/judge-cli-v1.mjs --profile full -- target/fixture/release/darty
      - name: Prove judge sensitivity
        run: node scripts/prove-cli-v1-mutation.mjs
      - name: Clean packaged Node consumers and declaration freshness
        env:
          DARTY_SDK_FIXTURE_TARGET: target/fixture
        run: node scripts/test-sdk-consumers.mjs
      - name: Release-profile Node panic containment
        run: cargo +1.88.0 test --release --locked -p darty-node
