[advisories]
version = 2
ignore = [
  # Unmaintained notice only, not a vulnerability, and no maintained chrono
  # release exists. Remove once darty migrates its date handling off chrono.
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; migration off chrono tracked separately" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "Elastic-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
