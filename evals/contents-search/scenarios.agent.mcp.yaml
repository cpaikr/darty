config:
  - vars:
      scenarioName: populated live search returns a structured filing result
      expectedFound: true
      expectedKeyword: 배당
      expectedStartDate: '20250331'
      expectedEndDate: '20260331'
      expectedCompanyCode: ''
      expectedReferencePrefix: https://dart.fss.or.kr/dsaf001/main.do?
      task: |
        Use the available DART MCP contents-search tool.

        Search for one filing whose contents match the keyword "배당" between 20250331 and 20260331.

        Return the tool result. Do not guess or invent values.
  - vars:
      scenarioName: explicit no-result search returns an empty structured result
      expectedFound: false
      expectedKeyword: unlikely-darty-eval-keyword-20260404
      expectedStartDate: '20250331'
      expectedEndDate: '20260331'
      expectedCompanyCode: ''
      expectedReferencePrefix: https://dart.fss.or.kr/dsaf001/main.do?
      task: |
        Use the available DART MCP contents-search tool.

        Search for the keyword "unlikely-darty-eval-keyword-20260404" between 20250331 and 20260331.

        Return the tool result. Do not guess or invent values.
  - vars:
      scenarioName: filtered live search honors a company code
      expectedFound: true
      expectedKeyword: 배당
      expectedStartDate: '20250331'
      expectedEndDate: '20260331'
      expectedCompanyCode: '00126380'
      expectedReferencePrefix: https://dart.fss.or.kr/dsaf001/main.do?
      task: |
        Use the available DART MCP contents-search tool.

        Search for one Samsung Electronics filing whose contents match the keyword "배당" between 20250331 and 20260331. Use the DART company code 00126380 as a companyCode filter.

        Return the tool result. Do not guess or invent values.

tests:
  - description: '{{scenarioName}}'
    assert:
      - type: javascript
        value: |
          const text = typeof output === 'string' ? output.trim() : JSON.stringify(output);

          const parseJson = (value) => {
            try {
              return JSON.parse(value);
            } catch {
              return undefined;
            }
          };

          const extractEnvelope = () => {
            const candidates = [
              text,
              text.replace(/^MCP Tool Result \([^)]+\):\s*/, ''),
            ];

            for (const candidate of candidates) {
              const parsed = parseJson(candidate);

              if (Array.isArray(parsed)) {
                for (const block of parsed) {
                  if (block?.type === 'text' && typeof block.text === 'string') {
                    const inner = parseJson(block.text);
                    if (inner?.result && inner?.metadata && inner?.references) {
                      return inner;
                    }
                  }
                }
              }

              if (parsed?.result && parsed?.metadata && parsed?.references) {
                return parsed;
              }
            }

            return undefined;
          };

          const hasToolWrapper = /MCP Tool Result \(contents-search\)/.test(text);
          const envelope = extractEnvelope();
          const pass = hasToolWrapper && envelope !== undefined;

          return {
            pass,
            score: pass ? 1 : 0,
            reason: `hasToolWrapper=${hasToolWrapper}, hasStructuredEnvelope=${envelope !== undefined}, outputLength=${text.length}`,
          };
      - type: javascript
        value: |
          const text = typeof output === 'string' ? output.trim() : JSON.stringify(output);

          const parseJson = (value) => {
            try {
              return JSON.parse(value);
            } catch {
              return undefined;
            }
          };

          const extractEnvelope = () => {
            const candidates = [
              text,
              text.replace(/^MCP Tool Result \([^)]+\):\s*/, ''),
            ];

            for (const candidate of candidates) {
              const parsed = parseJson(candidate);

              if (Array.isArray(parsed)) {
                for (const block of parsed) {
                  if (block?.type === 'text' && typeof block.text === 'string') {
                    const inner = parseJson(block.text);
                    if (inner?.result && inner?.metadata && inner?.references) {
                      return inner;
                    }
                  }
                }
              }

              if (parsed?.result && parsed?.metadata && parsed?.references) {
                return parsed;
              }
            }

            return undefined;
          };

          const expectedFound = '{{expectedFound}}' === 'true';
          const expectedKeyword = '{{expectedKeyword}}';
          const expectedStartDate = '{{expectedStartDate}}';
          const expectedEndDate = '{{expectedEndDate}}';
          const expectedCompanyCode = '{{expectedCompanyCode}}';
          const expectedReferencePrefix = '{{expectedReferencePrefix}}';
          const envelope = extractEnvelope();

          if (envelope === undefined) {
            return {
              pass: false,
              score: 0,
              reason: 'Expected a structured contents-search envelope but could not parse one.',
            };
          }

          const request = envelope.result?.request;
          const hasExpectedRequest = request?.keyword === expectedKeyword && request?.startDate === expectedStartDate && request?.endDate === expectedEndDate;
          const hasExpectedCompanyFilter = expectedCompanyCode === '' || request?.companyCode === expectedCompanyCode;
          const pagination = envelope.result?.pagination;
          const items = envelope.result?.items;
          const firstItem = Array.isArray(items) ? items[0] : undefined;
          const viewerUrl = firstItem?.references?.viewerUrl;
          const receiptNumber = firstItem?.filing?.receiptNumber;
          const snippetText = firstItem?.match?.snippetText;

          if (expectedFound) {
            const hasItems = Array.isArray(items) && items.length > 0;
            const hasPositiveCount = pagination?.totalCount > 0 && pagination?.returnedCount > 0;
            const hasViewerUrl = typeof viewerUrl === 'string' && viewerUrl.startsWith(expectedReferencePrefix);
            const hasReceiptNumber = typeof receiptNumber === 'string' && /^20\d{12}$/.test(receiptNumber);
            const hasSnippet = typeof snippetText === 'string' && snippetText.length > 0;
            const allItemsMatchCompanyFilter = expectedCompanyCode === '' || (Array.isArray(items) && items.every((item) => item?.company?.companyCode === expectedCompanyCode));
            const pass = hasExpectedRequest && hasExpectedCompanyFilter && allItemsMatchCompanyFilter && hasItems && hasPositiveCount && hasViewerUrl && hasReceiptNumber && hasSnippet;

            return {
              pass,
              score: pass ? 1 : 0,
              reason: `Expected populated result. hasExpectedRequest=${hasExpectedRequest}, hasExpectedCompanyFilter=${hasExpectedCompanyFilter}, allItemsMatchCompanyFilter=${allItemsMatchCompanyFilter}, hasItems=${hasItems}, hasPositiveCount=${hasPositiveCount}, hasViewerUrl=${hasViewerUrl}, hasReceiptNumber=${hasReceiptNumber}, hasSnippet=${hasSnippet}`,
            };
          }

          const hasEmptyItems = Array.isArray(items) && items.length === 0;
          const hasZeroCount = pagination?.totalCount === 0 && pagination?.returnedCount === 0;
          const hasViewerReference = text.includes(expectedReferencePrefix);
          const hasReceiptReference = /\b20\d{12}\b/.test(text);
          const pass = hasExpectedRequest && hasExpectedCompanyFilter && hasEmptyItems && hasZeroCount && !hasViewerReference && !hasReceiptReference;

          return {
            pass,
            score: pass ? 1 : 0,
            reason: `Expected empty result. hasExpectedRequest=${hasExpectedRequest}, hasExpectedCompanyFilter=${hasExpectedCompanyFilter}, hasEmptyItems=${hasEmptyItems}, hasZeroCount=${hasZeroCount}, hasViewerReference=${hasViewerReference}, hasReceiptReference=${hasReceiptReference}`,
          };
