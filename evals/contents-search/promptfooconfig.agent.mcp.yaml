# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: darty contents-search MCP agent evals

prompts:
  - '{{task}}'

providers:
  - id: openai:chat:gpt-5.4-mini
    label: gpt-5.4-mini-mcp-agent
    config:
      mcp:
        enabled: true
        timeout: 120000
        server:
          command: bun
          args: ['run', 'src/mcp.ts']
          name: darty

scenarios:
  - file://./scenarios.agent.mcp.yaml
