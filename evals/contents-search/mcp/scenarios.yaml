config:
  - vars:
      scenarioName: populated live search returns a structured filing result
      expectedFound: true
      expectedKeyword: 배당
      expectedStartDate: '20250331'
      expectedEndDate: '20260331'
      expectedCompanyCode: ''
      expectedReferencePrefix: https://dart.fss.or.kr/dsaf001/main.do?
      task: |
        Use the darty MCP contents-search tool to search DART filing contents for one filing that matches the keyword "배당" between 20250331 and 20260331.

        Use live DART data. Do not guess or invent values. Return the structured result you obtain.
  - vars:
      scenarioName: explicit no-result search returns an empty structured result
      expectedFound: false
      expectedKeyword: unlikely-darty-eval-keyword-20260404
      expectedStartDate: '20250331'
      expectedEndDate: '20260331'
      expectedCompanyCode: ''
      expectedReferencePrefix: https://dart.fss.or.kr/dsaf001/main.do?
      task: |
        Use the darty MCP contents-search tool to search DART filing contents for the keyword "unlikely-darty-eval-keyword-20260404" between 20250331 and 20260331.

        Use live DART data. Do not guess or invent values. Return the structured result you obtain.
  - vars:
      scenarioName: filtered live search honors a company code
      expectedFound: true
      expectedKeyword: 배당
      expectedStartDate: '20250331'
      expectedEndDate: '20260331'
      expectedCompanyCode: '00126380'
      expectedReferencePrefix: https://dart.fss.or.kr/dsaf001/main.do?
      task: |
        Use the darty MCP contents-search tool to search DART filing contents for one Samsung Electronics filing that matches the keyword "배당" between 20250331 and 20260331. Use DART company code 00126380 as the company code filter.

        Use live DART data. Do not guess or invent values. Return the structured result you obtain.

tests:
  - description: '{{scenarioName}}'
    assert:
      - type: javascript
        value: file://./assertions.js:assertStructuredEnvelope
      - type: javascript
        value: file://./assertions.js:assertContentsSearchFacts
