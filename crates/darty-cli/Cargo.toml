[package]
name = "darty-cli"
description = "Standalone command-line interface for the Darty Rust SDK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
fixture-origin = ["darty/fixture-origin"]

[[bin]]
name = "darty"
path = "src/main.rs"
doc = false

[dependencies]
clap.workspace = true
chrono.workspace = true
darty = { path = "../darty", version = "0.6.1" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true

[lints]
workspace = true
