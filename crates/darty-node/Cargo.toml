[package]
name = "darty-node"
description = "Node.js binding candidate for the supported DART workflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
default = []
# The test addon is built into an isolated target directory by the packaged
# candidate acceptance test. Keeping fixture transport behind this feature
# means the production addon cannot consume test origins or fixed clocks.
test-fixture = ["darty/fixture-origin", "dep:url"]

[dependencies]
darty = { path = "../darty", version = "0.5.0" }
futures-util.workspace = true
napi.workspace = true
napi-derive.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url = { workspace = true, optional = true }

[build-dependencies]
napi-build.workspace = true

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
